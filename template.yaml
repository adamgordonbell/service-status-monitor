AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  ServiceStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: app-server:latest
      ImageConfig:
        Command: ["scripts.app_server.lambda_handler"]
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FLASK_ENV: development
      Events:
        ProdRoot:
          Type: Api
          Properties:
            Path: /prod/
            Method: GET
        ProdStatus:
          Type: Api
          Properties:
            Path: /prod/status
            Method: GET
        ProdPacketStats:
          Type: Api
          Properties:
            Path: /prod/packet-stats
            Method: GET
        CandidateRoot:
          Type: Api
          Properties:
            Path: /candidate/
            Method: GET
        CandidateStatus:
          Type: Api
          Properties:
            Path: /candidate/status
            Method: GET
        CandidatePacketStats:
          Type: Api
          Properties:
            Path: /candidate/packet-stats
            Method: GET
        StableRoot:
          Type: Api
          Properties:
            Path: /stable/
            Method: GET
        StableStatus:
          Type: Api
          Properties:
            Path: /stable/status
            Method: GET
        StablePacketStats:
          Type: Api
          Properties:
            Path: /stable/packet-stats
            Method: GET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: infra/Dockerfile
