AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  ServiceStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: app-server:latest
      ImageConfig:
        Command: ["scripts.app_server.lambda_handler"]
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FLASK_ENV: development
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ProdProxy:
          Type: Api
          Properties:
            Path: /prod/{proxy+}
            Method: ANY
        CandidateProxy:
          Type: Api
          Properties:
            Path: /candidate/{proxy+}
            Method: ANY
        StableProxy:
          Type: Api
          Properties:
            Path: /stable/{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: infra/Dockerfile
